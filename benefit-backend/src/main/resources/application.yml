server:
  # 未設 PORT 時用 8080
  port: ${PORT:8080}
  # 讀取 Render 的 X-Forwarded-Proto，讓 Swagger 產生 https 網址。
  forward-headers-strategy: framework

spring:
  application:
    name: benefit-backend
  config:
    import: optional:file:.env[.properties]
  # DB_TYPE=h2 時改走 application-h2.yml
  profiles:
    active: ${DB_TYPE:mssql}

  # 上傳檔案大小上限（收藏照片、爬蟲JSON）
  # 照片的10MB上限會在UseBenefitService另外檢查，這裡抓比較大是給爬蟲JSON用
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Email SMTP
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME} #環境變數設定在"會員"分頁有註解，不清楚再問群組
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # datasource
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://localhost:14330;database=BenefitsJourney;trustServerCertificate=true;
    username: sa
    password: ${DB_PASSWORD:}

  # jackson
  jackson:
    time-zone: Asia/Taipei

  #JPA
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        "[column_ordering_strategy]": legacy
        "[use_nationalized_character_data]": true

  # output
  output:
    ansi:
      enabled: always

#JWT
jwt:
  token:
    expire: 240
    secret: ${JWT_SECRET}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"

springdoc:
  swagger-ui:
    doc-expansion: none

# Google OAuth Client ID
google:
  client-id: ${GOOGLE_CLIENT_ID}

# 初始管理員設定：從環境變數讀取，不在程式碼中寫死帳密
app:
  admin-init:
    account: ${ADMIN_INIT_ACCOUNT:}
    password: ${ADMIN_INIT_PASSWORD:}
    email: ${ADMIN_INIT_EMAIL:}

  password-reset-url: ${PASSWORD_RESET_URL:}

  # 常駐網域在 CorsOrigins。這裡只放會換的來源（ngrok 等），逗號分隔。
  # 正式環境可設 CORS_ALLOW_LOCAL_PATTERNS=false，關掉本機與區網模式。
  cors:
    origins: ${CORS_ALLOWED_ORIGINS:}
    allow-local-patterns: ${CORS_ALLOW_LOCAL_PATTERNS:true}
